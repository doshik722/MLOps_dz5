# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "cpu"             # Intel Iris Xe не поддерживает CUDA или MPS
  # На CPU используем float32 согласно методичке. На CUDA/MPS можно
  # выбрать bfloat16 для базовых весов; матрицы LoRA остаются float32.
  dtype: "float32"          # режим CPU из методички
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Исходный выход ДЗ 4 сохранён. Для CPU берём фиксированный срез train.
  source_train: "data/tokenized/train.pt"
  subset_size: 512
  subset_seed: 42
  train: "data/tokenized/train_512.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8; меньше памяти на микробатч
  num_threads: 4            # четыре физических ядра i7-1165G7
  lr: 2.0e-4               # ориентир устойчивого прогона из лекции
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Оценка по одному примеру ограничивает память для логитов всего словаря.
  eval_batch_size: 1
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "ЗАРАЗА!!!!"
    - "Ужаснейший прогресс"
    - "Веселуха епт"
    - "Окружены, но не сломлены!\nВторые сутки на ногах без сна, 25км пешком, поезда и автобусы... Полёт нормальный =)"
    - "Нам остается жить на этой земле лишь несколько десятилетий, а мы теряем столько невозвратимых часов, раздумывая об обидах, о которых через год мы забудем, о них забудут и все окружающие.\n\nДейл Карнеги"
  system: "Определи тональность русского предложения. Ответь только одним словом: негативное, нейтральное или позитивное."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
